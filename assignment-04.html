<body>
    <header>
        <h1>Campus News</h1>

    <nav aria-label="Main navigation"><a href="#home">Home</a> | <a href="#news">News</a></nav>

        <article id="news">

            <p>The annual college science fair is next month.</p><time datetime="2026-12-05">December 5, 2026</time>
