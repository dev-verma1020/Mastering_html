<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17: Form Attributes and Input Validation</title>
</head>

<body>
    <h1 align="center">Registration Form </h1>
    <form action="submit.php" method="POST">
        <label for="name">Full name</label>
        <input id="name" type="text"   name="name" placeholder="FULL NAME" required ></br></br>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@college.edu" required>
    </br></br>
    <label for="mobile">PHONE NO.</label>
    <input id="mobile" name="mobile"  type="tel" placeholder="10-didgit mobile" required></br></br>
        <label for="age">AGE</label>
            <input id="age" name="age" type="number" placeholder="AGE" min="18" max="100" required></br></br>

            <label for="password">Password </label>
            <input id="password" name="password" type="password" placeholder="(minimum 8 characters)" minlength="8" required>
            </br></br>
            <button type="submit">Register</button>
        </form>
</body>

</html>
