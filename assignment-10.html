<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 10: Multimedia: Image, Video, Audio and YouTube</title>
</head>

<body>
    <h1>Multimedia Examples</h1>
    <h2>Image</h2>
    <img src="https://placehold.co/500x280" alt="Sample landscape" width="500">
    <h2>Video</h2>
    <video controls width="500">
        <source src="media/sample-video.mp4" type="video/mp4">Video not supported.
    </video>
    <h2>Audio</h2><audio controls>
        <source src="media/sample-audio.mp3" type="audio/mpeg">Audio not supported.
    </audio>
    <h2>YouTube</h2>
    <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/ysz5S6PUM-U"
        title="Sample YouTube video" allowfullscreen></iframe>
</body>

</html>
