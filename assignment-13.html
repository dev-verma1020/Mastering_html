<!DOCTYPE html>
<html>
<head>
    <title>Weekly Timetable</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Weekly Timetable</h2>

    <table>
        <tr>
            <th colspan="4">Weekly Timetable</th>
        </tr>

        <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>

        <tr>
            <td>Mon</td>
            <td>Maths</td>
            <td>HTML</td>
            <td rowspan="2">Web Lab</td>
        </tr>

        <tr>
            <td>Tue</td>
            <td>Physics</td>
            <td>OS</td>
        </tr>

        <tr>
            <td>Wed</td>
            <td colspan="3">Holiday</td>
        </tr>
    </table>

</body>
</html>
