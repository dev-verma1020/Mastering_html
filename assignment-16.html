<!DOCTYPE html>
<html lang="en">

<head>

    <title>Assignment 16: Select, Textarea and Buttons</title>
</head>

<body>
    <h1>Course Feedback</h1>
    <form>
        <label for="course">Choose a course</label>
        <select id="course" name="course">
            <option value="">Select one</option>
            <option>HTML Basics</option>
            <option>CSS Basics</option>
        </select></br></br>
        <label for="feedback">Your feedback</label>
        <textarea id="feedback" name="feedback" placeholder="Enter your feedback" rows="5"cols="30"
            ></textarea></br></br>
            <button type="submit">Submit feedback</button><button type="reset">Clear form</button>
    </form>
</body>

</html>
